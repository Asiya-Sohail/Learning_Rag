[project]
name = "ytrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Asiya Sohail", email = "sohailasiya27@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "numpy>=2.5.4",
    "pymupdf>=2.0",
    "pypdf>=6.21.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
ytrag = "ytrag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
